<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aset MBO – Sistem Manajemen Aset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F8FF;--surface:#FFFFFF;--sunk:#EEF6FF;--ink:#0F2A44;--muted:#52708E;--line:#D4E5F6;
  --accent:#1673C0;--accent-ink:#FFFFFF;--accent-soft:#DCEEFF;
  --side:#DDEFFF;--side-line:#C4DFF7;--side-hover:rgba(255,255,255,.6);--dot:#D3E6FA;
  --warn:#A9590A;--warn-soft:#FCEEDB;--crit:#B4233F;--crit-soft:#FCE4E9;--good:#22804D;--good-soft:#DDF3E6;
  --k-rahasia:#B4233F;--k-terbatas:#B9650A;--k-internal:#5A4FCF;--k-publik:#22804D;--k-none:#8EA3B8;--k-on:#FFFFFF;
  --scrim:rgba(15,42,68,.32);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1726;--surface:#102135;--sunk:#15293F;--ink:#E3EEFA;--muted:#93ABC4;--line:#22394F;
    --accent:#6BB8F5;--accent-ink:#08182A;--accent-soft:#163552;
    --side:#0E1E31;--side-line:#1D3550;--side-hover:rgba(107,184,245,.10);--dot:#132840;
    --warn:#F0A95E;--warn-soft:#3A2A16;--crit:#F48CA0;--crit-soft:#3E1C28;--good:#7FD3A0;--good-soft:#173527;
    --k-rahasia:#F48CA0;--k-terbatas:#F0A95E;--k-internal:#A99CFF;--k-publik:#7FD3A0;--k-none:#7F93A8;--k-on:#0B1726;
    --scrim:rgba(0,0,0,.55);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1726;--surface:#102135;--sunk:#15293F;--ink:#E3EEFA;--muted:#93ABC4;--line:#22394F;
  --accent:#6BB8F5;--accent-ink:#08182A;--accent-soft:#163552;
  --side:#0E1E31;--side-line:#1D3550;--side-hover:rgba(107,184,245,.10);--dot:#132840;
  --warn:#F0A95E;--warn-soft:#3A2A16;--crit:#F48CA0;--crit-soft:#3E1C28;--good:#7FD3A0;--good-soft:#173527;
  --k-rahasia:#F48CA0;--k-terbatas:#F0A95E;--k-internal:#A99CFF;--k-publik:#7FD3A0;--k-none:#7F93A8;--k-on:#0B1726;
  --scrim:rgba(0,0,0,.55);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.5px);background-size:22px 22px;background-attachment:fixed;color:var(--ink);font:15px/1.5 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;padding:22px 14px;background:var(--side);border-right:1px solid var(--side-line);overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px;color:var(--ink);text-decoration:none}
.brand svg{flex:none;color:var(--accent)}
.brand b{display:block;font-size:15.5px;line-height:1.2}
.brand span{font-size:12.5px;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;white-space:nowrap}
nav a:hover{background:var(--side-hover)}
nav a[aria-current="page"]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent),0 1px 3px rgba(22,115,192,.14)}
nav .grp{font-size:12.5px;color:var(--muted);margin:14px 10px 4px}
nav .n{font-size:12px;font-weight:700;min-width:22px;text-align:center;padding:1px 6px;border-radius:999px;background:var(--crit-soft);color:var(--crit)}
.who{margin-top:auto;border-top:1px solid var(--side-line);padding:16px 8px 0;display:flex;flex-direction:column;gap:6px}
.who label{font-size:12.5px;color:var(--muted)}
.who p{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.4}
main{padding:28px clamp(16px,3vw,40px) 72px;max-width:1180px;width:100%}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 22px;max-width:68ch}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:16px;margin:0}
.panel-h span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.btn.sm{padding:5px 11px;font-size:13px}
.ivt td,.ivt th{padding:8px 10px}
.ivt select{padding:5px 8px}
.sumline{margin:0;font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs button{font:inherit;font-weight:600;font-size:14.5px;padding:10px 14px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .n{font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--crit-soft);color:var(--crit)}
.rvsum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.rvsum button{font:inherit;font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.rvsum button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.notes li{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.notes p{margin:0 0 4px;font-size:14px}
.notes small{color:var(--muted);font-size:12.5px}
.note-add{display:flex;flex-direction:column;gap:8px}
.tbl.wide td{white-space:nowrap}
.tbl.wide td.wrap{white-space:normal;min-width:220px}
.tbl.wide th:first-child,.tbl.wide td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.tbl.wide tr.row:hover td:first-child{background:var(--sunk)}
.drawer .attrs dd small{display:inline;margin-left:6px}
.drawer .attrs dd small:not(.miss){color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.linkish:hover{text-decoration-color:currentColor}
.kls{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--kc);white-space:nowrap}
.kls::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--kc)}
.kls.none{font-weight:500;font-style:italic}
.st{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.st.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.st.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.st.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.st.mute{color:var(--muted)}
.due{display:flex;flex-direction:column;font-size:13.5px;white-space:nowrap}
.due small{font-size:12px;color:var(--muted)}
.due.crit small{color:var(--crit);font-weight:600}
.due.warn small{color:var(--warn);font-weight:600}

/* dasbor */
.dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.gap{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.gap:first-of-type{border-top:0}
.gap:hover{background:var(--sunk)}
.gap-n{display:grid;place-items:center;height:36px;border-radius:6px;background:var(--crit-soft);color:var(--crit);font-weight:700;font-size:17px}
.gap.clear .gap-n{background:var(--good-soft);color:var(--good)}
.gap.clear .gap-t{color:var(--muted)}
.gap-c{font-size:12.5px;color:var(--muted);white-space:nowrap}
.comp{padding:16px;display:flex;flex-direction:column;gap:14px}
.comp-h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.comp-h span{color:var(--muted)}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;background:var(--sunk)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.gr{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
.gr svg{display:block;width:100%;height:auto;min-width:540px}
.gr-ax{font-size:12px;fill:var(--muted)}
.gr-m{font-size:12px;fill:var(--muted);text-anchor:middle}
.gr-v{font-size:12px;font-weight:700;text-anchor:middle}
.gr-sum{margin:0;font-size:14.5px}
.gr-hint{display:none;margin:0;font-size:12.5px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:12px 16px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.exp li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.exp small{color:var(--muted);font-size:12.5px;grid-column:1}
.exp .tone{grid-row:1 / span 2;grid-column:2;font-size:13px;font-weight:700;white-space:nowrap}
.tone.crit{color:var(--crit)}.tone.warn{color:var(--warn)}.tone.mute{color:var(--muted)}
.exp .prog{grid-column:1 / -1;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.kpi small{font-size:12.5px;color:var(--muted)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{border-top:2px solid var(--line)}
.store-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.side-head{display:flex;align-items:center;gap:6px}
.bell.top-bell{position:fixed;top:14px;right:clamp(16px,3vw,40px);z-index:25;box-shadow:0 2px 8px rgba(0,0,0,.18)}
@media (min-width:861px){main{padding-top:68px}}
.side-head .brand{flex:1;min-width:0}
.bell{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:none}
.bell:hover{background:var(--sunk)}
.bell-n{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.bell-n[hidden]{display:none}
.nlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.nitem{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-left-width:4px;border-radius:10px;background:var(--surface);color:inherit;cursor:pointer;font:inherit}
.nitem:hover{background:var(--sunk)}
.nitem.unread{background:var(--accent-soft)}
.nitem.crit{border-left-color:var(--crit)}
.nitem.warn{border-left-color:var(--warn)}
.nbody{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.nbody b{font-size:14.5px}
.nbody span:not(.nk){font-size:13.5px;color:var(--muted)}
.nbody small{font-size:12px;color:var(--muted)}
.nk{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}
.gr-filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;padding:12px 16px;border-bottom:1px solid var(--line)}
.gr-filters .field{flex:1 1 140px;min-width:0;margin:0}
.gr-filters .field label{font-size:12.5px}
.gr-filters .btn{flex:none}
.people{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.chip{display:inline-flex;align-items:center;gap:2px;padding:4px 4px 4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13.5px}
.chip-x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:0 6px;border-radius:50%}
.chip-x:hover{color:var(--crit)}
.people-add{display:flex;gap:8px;align-items:center}
.people-add input{flex:1;min-width:0}
.prog.warn span{background:var(--warn)}.prog.crit span{background:var(--crit)}
.act li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;font-size:14px}
.act time{font-size:12.5px;color:var(--muted);padding-top:1px}
.act small{display:block;margin-top:2px}

/* register */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.filters input{flex:1 1 260px}
input,select,textarea{font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:72px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13.5px;margin-bottom:12px}
.chip button{border:0;background:none;color:inherit;font-size:18px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:999px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12.5px;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td small{display:block;color:var(--muted);font-size:12.5px}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover,.tbl tr.row:focus-visible{background:var(--sunk)}
.tbl tr.row.gone{opacity:.6}
.id{font-weight:600;white-space:nowrap;font-size:13.5px}
.miss{color:var(--crit);font-weight:600}
.count{font-size:13px;color:var(--muted);margin:10px 2px}
.empty{padding:28px 16px;color:var(--muted);text-align:center}

/* form */
.form{padding:20px;display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;font-weight:600}
.req::after{content:" *";color:var(--crit)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.seg{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.seg legend{font-size:13px;font-weight:600;margin-bottom:8px;padding:0}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:8px 18px;border:1px solid var(--line);border-radius:6px;font-weight:600;cursor:pointer}
.seg input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sub{font-size:15px;margin:0;padding-top:18px;border-top:1px solid var(--line)}
.cia{display:flex;gap:8px;align-items:center}
.cia span{font-size:13px;font-weight:600;color:var(--muted)}
.cia select{flex:1}
.err{color:var(--crit);font-weight:600;margin:0;min-height:1.2em;font-size:14px}
.done-wrap{max-width:460px;display:flex;flex-direction:column;gap:18px}

/* tag */
.tag{display:grid;grid-template-columns:minmax(0,1fr) auto;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.tag-band{grid-column:1 / -1;background:var(--kc);color:var(--k-on);font-weight:700;font-size:13px;padding:5px 12px;display:flex;justify-content:space-between;gap:12px}
.tag-body{padding:10px 12px 12px;min-width:0}
.tag-co{font-size:11.5px;color:var(--muted)}
.tag-id{font-size:24px;font-weight:700;letter-spacing:.02em;line-height:1.25;margin-top:2px}
.tag-name{font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.tag-qr{padding:10px 12px 10px 0;color:var(--ink);display:flex;align-items:center}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 24px calc(32px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.dr-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px}
.icon{border:0;background:none;color:var(--ink);font-size:24px;line-height:1;cursor:pointer;padding:4px 10px;border-radius:6px}
.icon:hover{background:var(--sunk)}
.dr-status{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:4px;font-size:13.5px;margin:0}
.note.crit{border-color:var(--crit);background:var(--crit-soft)}
.drawer>*{flex-shrink:0}
.drawer h3{font-size:14px;margin:12px 0 0}
.attrs{display:grid;grid-template-columns:minmax(120px,38%) minmax(0,1fr);gap:8px 16px;margin:0}
.attrs dt{color:var(--muted);font-size:13.5px}
.attrs dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.attrs dd select{max-width:100%}
.rel{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;margin-bottom:6px}
.rel:hover{background:var(--sunk)}
.rel small{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.rel i{width:4px;height:16px;border-radius:2px;background:var(--kc);flex:none}
.hist{list-style:none;margin:4px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.hist li{position:relative;padding:0 0 14px 12px;display:grid;gap:1px;font-size:14px}
.hist li::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.hist time,.hist small{font-size:12.5px;color:var(--muted)}

function prot(a){
  if(a.cat==='INF')return {cls:a.cls,from:[]};
  const seen=new Set([a.id]),inf=[];let fr=[a];
  for(let h=0;h<2;h++){const nx=[];fr.forEach(n=>n.related.forEach(id=>{if(seen.has(id))return;seen.add(id);const r=byId(id);if(!r)return;if(r.cat==='INF')inf.push(r);else nx.push(r);}));fr=nx;}
  const best=inf.filter(r=>r.cls).sort((x,y)=>RANK[x.cls]-RANK[y.cls])[0];
  return {cls:best?best.cls:'',from:best?inf.filter(r=>r.cls===best.cls).map(r=>r.name):[]};
}

function cell(a,k){const x=a.x,v=x[k];
  switch(k){

    case 'status':return st(a.status);

    case 'harga':return isEmpty(v)?MISS:rp(v);
    case 'umur':{if(isEmpty(v))return MISS;const over=x.tgl&&(-days(x.tgl))>v*30;return `${v} bulan${over?'<small class="miss">terlampaui</small>':''}`;}
    case 'disp':return dispOf(a);

    case 'capT':case 'capU':{if(x.capUnit==='Tidak berlaku')return 'Tidak berlaku';if(isEmpty(v)||!x.capUnit)return MISS;let s=`${nf0(v)} ${x.capUnit}`;if(k==='capU'&&x.capT){const p=Math.round(v/x.capT*100);s+=`<small class="${p>=90?'miss':''}">${p}% terpakai</small>`;}return s;}

function qr(id){
  let h=2166136261;for(const ch of id){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}
  const N=17,fin=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);let s='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(fin(x,y))continue;h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;if(h&1)s+=`M${x} ${y}h1v1h-1z`;}
  const f=(x,y)=>`M${x} ${y}h7v7h-7z M${x+1} ${y+1}v5h5v-5z M${x+2} ${y+2}h3v3h-3z`;
  return `<svg viewBox="-1 -1 ${N+2} ${N+2}" width="84" height="84" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="${f(0,0)} ${f(N-7,0)} ${f(0,N-7)}"/><path fill="currentColor" d="${s}"/></svg>`;
}

}

function capUsage(){return live().filter(a=>a.cat==='VIR'&&a.x.capUnit&&a.x.capUnit!=='Tidak berlaku'&&a.x.capT>0&&!isEmpty(a.x.capU)).map(a=>({a,p:Math.round(a.x.capU/a.x.capT*100)})).sort((x,y)=>y.p-x.p);}
function ageUsage(){return live().filter(a=>a.cat==='FIS'&&a.x.tgl&&+a.x.umur>0).map(a=>{const y=Math.max(0,-days(a.x.tgl))/DEP_CFG.hariBulan;return {a,y,r:y/+a.x.umur};}).sort((x,y)=>y.r-x.r);}
function capPanel(){
  const all=capUsage(),L=all.filter(x=>x.p>=75),full=L.filter(x=>x.p>=90).length;
  return `<section class="panel"><div class="panel-h"><h2>Kapasitas lisensi dan langganan</h2><span>${full} penuh atau hampir penuh dari ${all.length} aset</span></div>

function filtered(){
  const f=S.f,q=f.q.trim().toLowerCase(),u=me();let r=A.slice();
  if(q)r=r.filter(a=>[a.id,a.name,a.owner,a.holder,a.pic,...(a.x&&a.x.admins||[]),...(a.x&&a.x.users||[])].join(' ').toLowerCase().includes(q));
  if((S.tab||'list')==='review'){
    r=r.filter(a=>a.owner&&a.next&&a.status!=='Dihapus');
    if(f.rv==='late')r=r.filter(a=>days(a.next)<0);
    if(f.rv==='due')r=r.filter(a=>days(a.next)>=0&&days(a.next)<=30);
    if(f.rv==='mine')r=r.filter(a=>a.pic===u.name);
    return r.sort((x,y)=>dn(x.next)-dn(y.next));
  }
  if(f.gap){const g=GAPS.find(x=>x.k===f.gap);r=r.filter(a=>a.status!=='Dihapus'&&g.fn(a));}
  if(f.cat)r=r.filter(a=>a.cat===f.cat);
  if(f.cls)r=r.filter(a=>f.cls==='none'?a.cat==='INF'&&!a.cls:a.cls===f.cls);
  if(f.status)r=r.filter(a=>a.status===f.status);
  return r;
}

function vPengembalian(){

/* --- Depresiasi aset dan log sistem --- */
const ymN=s=>+s.slice(0,4)*12+ +s.slice(5,7)-1;
const ymS=n=>`${Math.floor(n/12)}-${String(n%12+1).padStart(2,'0')}`;
const perLbl=m=>`${MONTHS[+m.slice(5)-1]} ${m.slice(0,4)}`;
const DEP_CFG={hariBulan:30,rumus:'v1'};
const endOf=m=>new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0)).toISOString().slice(0,10);
const dBetween=(a,b)=>Math.round((Date.UTC(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10))-Date.UTC(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10)))/864e5);
const depOk=a=>a.cat==='FIS'&&!!a.x.tgl&&+a.x.harga>0&&+a.x.umur>0;
const perBulan=a=>+a.x.harga/+a.x.umur;
const perHari=a=>perBulan(a)/DEP_CFG.hariBulan;
const hariAt=(a,m)=>Math.max(0,dBetween(a.x.tgl,endOf(m)));
const cumAt=(a,m)=>depOk(a)?Math.min(+a.x.harga,Math.round(perHari(a)*hariAt(a,m))):0;
const DEP={last:'2026-10',runs:[]};
const depAcc=a=>{if(!depOk(a))return 0;if(a.depAcc===undefined)a.depAcc=cumAt(a,DEP.last);return a.depAcc;};
const bookOf=a=>depOk(a)?Math.max(0,+a.x.harga-depAcc(a)):null;
const fullDate=a=>depOk(a)?addDays(a.x.tgl,Math.round(+a.x.umur*DEP_CFG.hariBulan)):null;
const fullMonth=a=>depOk(a)?fullDate(a).slice(0,7):null;
const depNext=()=>ymS(ymN(DEP.last)+1);
const depOpen=()=>DEP.runs.find(r=>['Draf','Menunggu persetujuan','Ditolak'].includes(r.status));
const depDue=()=>ymN(depNext())<=ymN(TODAY.slice(0,7));
const isFin=()=>me().role==='Finance';
const isBOD=()=>me().role==='BOD';
const depEntries=M=>A.filter(a=>depOk(a)&&a.status!=='Dihapus'&&ymN(a.x.tgl)<=ymN(M)).map(a=>{const acc=depAcc(a),h=+a.x.harga,dep=Math.max(0,Math.min(h-acc,cumAt(a,M)-acc));return {id:a.id,name:a.name,harga:h,dep,calc:dep,adj:null,before:acc,after:acc+dep,book:h-acc-dep};}).filter(e=>e.dep>0);
const sumDep=es=>es.reduce((s,e)=>s+e.dep,0);
S.dep={view:null,f:'',edit:null};
(function(){
  for(let n=ymN('2026-06');n<=ymN('2026-10');n++){
    const M=ymS(n),es=A.filter(a=>depOk(a)&&ymN(a.x.tgl)<=n).map(a=>{const h=+a.x.harga,pv=cumAt(a,ymS(n-1)),cu=cumAt(a,M);return {id:a.id,name:a.name,harga:h,dep:cu-pv,calc:cu-pv,adj:null,before:pv,after:cu,book:h-cu};}).filter(e=>e.dep>0);
    const d1=addDays(M+'-01',31).slice(0,7)+'-02',d2=addDays(d1,2);
    DEP.runs.unshift({id:`DEP-${M}`,m:M,status:'Disetujui',by:'Hendra Wijaya',byKey:'hendra',d:d1,ver:{by:'Direksi MBO',d:d2},rej:null,entries:es,total:sumDep(es),rumus:DEP_CFG.rumus,hist:[{d:d2,by:'Direksi MBO',text:'Periode disetujui'},{d:d1,by:'Hendra Wijaya',text:'Diajukan ke BOD'},{d:d1,by:'Hendra Wijaya',text:'Periode dihitung (draf)'}]});
  }
})();
(function(){
  const M=depNext(),es=depEntries(M);
  DEP.runs.unshift({id:`DEP-${M}`,m:M,status:'Draf',by:'Hendra Wijaya',byKey:'hendra',d:TODAY,ver:null,rej:null,entries:es,total:sumDep(es),rumus:DEP_CFG.rumus,hist:[{d:TODAY,by:'Hendra Wijaya',text:'Periode dihitung (draf)'}]});
})();

  const tot=L.reduce((s,a)=>s+(+a.x.harga),0),acc=L.reduce((s,a)=>s+depAcc(a),0),full=L.filter(a=>bookOf(a)===0).length;

(function(){

  DEP.runs.forEach(r=>{seed.push({t:`${r.d} 09:15:00`,user:r.by,kind:'Depresiasi',obj:r.id,text:`Periode ${perLbl(r.m)} dihitung${r.ver?'':' sebagai draf'}: ${rp(r.total)} untuk ${r.entries.length} aset`});if(r.ver)seed.push({t:`${r.ver.d} 10:40:00`,user:r.ver.by,kind:'Depresiasi',obj:r.id,text:`Periode ${perLbl(r.m)} disetujui`});});
  seed.sort((x,y)=>x.t<y.t?-1:1).forEach(e=>{e.role=roleOfName(e.user);e.n=++sysSeq;SYS.unshift(e);});
})();

const exportBtns=what=>`<button class="btn sm" data-act="export" data-what="${what}" data-fmt="xlsx">Ekspor Excel</button><button class="btn sm" data-act="export" data-what="${what}" data-fmt="csv">CSV</button>`;
function doExport(slug,title,sets,filters,fmtX){
  const n=sets[0].rows.length;
  if(!sets.some(s=>s.rows.length)){toast('Tidak ada data untuk diekspor');return;}
  const u=me();
  const info=[['Judul',title],['Diekspor oleh',u.name],['Peran',u.role||u.jab],['Waktu ekspor',`${fmt(TODAY)} ${nowT()}`],['Jumlah baris (lembar pertama)',n],...filters.map(f=>[f[0],f[1]])];
  try{
    if(fmtX==='csv')downloadBlob(new Blob([csvOf(sets[0])],{type:'text/csv;charset=utf-8'}),`aset-mbo-${slug}-${TODAY}.csv`);
    else downloadBlob(xlsxBlob(sets,info),`aset-mbo-${slug}-${TODAY}.xlsx`);
    syslog('Akses',title,`Ekspor ${title.toLowerCase()} (${n} baris, ${fmtX==='csv'?'CSV':'Excel'})`);
    toast(`${n} baris diekspor ke ${fmtX==='csv'?'CSV':'Excel'}`);
  }catch(e){toast('Ekspor tidak dapat dijalankan di lingkungan ini');}
}
function plainVal(a,k){
  const x=a.x;
  if(['harga','umur','akun','capT','capU'].includes(k))return isEmpty(x[k])?'':+x[k];
  if(k==='book'){const b=bookOf(a);return b==null?'':b;}
  if(k==='tgl')return x.tgl||'';
  if(k==='exp')return x.noexp?'Tanpa masa berlaku':(a.exp||'');
  if(k==='tahun')return x.tgl?+x.tgl.slice(0,4):'';
  if(k==='admins'||k==='users')return Array.isArray(x[k])?x[k].join('; '):'';
  if(k==='link')return x.link||'';
  if(k==='lastupd')return a.hist.length?a.hist[0][0]:'';
  if(k==='holder')return a.holder||(a.cat==='FIS'?'Perusahaan':'');
  if(k==='role')return a.owner||'';
  if(k==='cls')return a.cls||'';
  if(k==='status')return a.status;
  const t=stripHtml(cell(a,k));return t==='Belum diisi'||t==='–'?'':t;
}
const colType=k=>['harga','book','umur','akun','capT','capU','tahun'].includes(k)?'num':['tgl','exp','lastupd'].includes(k)?'date':'txt';
function filterInfo(){
  const f=S.f,r=[];
  if(f.q)r.push(['Filter pencarian',f.q]);if(f.cat)r.push(['Filter kategori',CAT_LABEL[f.cat]]);
  if(f.cls)r.push(['Filter klasifikasi',f.cls==='none'?'Belum diklasifikasi':f.cls]);if(f.status)r.push(['Filter status',f.status]);
  if(f.gap){const g=GAPS.find(x=>x.k===f.gap);r.push(['Filter celah kepatuhan',g?g.l||g.k:f.gap]);}
  return r.length?r:[['Filter','Tidak ada (semua aset)']];
}

    rows:L.map(a=>[a.id,CAT_LABEL[a.cat],a.name,a.sub,a.status,a.owner,a.dept,a.loc,a.holder||'',a.cls,a.pic,regOf(a),a.last,a.next,a.next?ivOf(a):''])};
  const sets=[common];
  ['FIS','VIR','INF'].forEach(c=>{const rs=L.filter(a=>a.cat===c);if(rs.length)sets.push({name:`Aset ${CAT_LABEL[c]}`,cols:COLS[c].map(([k,l])=>({h:l,t:colType(k)})),rows:rs.map(a=>COLS[c].map(([k])=>plainVal(a,k)))});});
  doExport('daftar-aset','Daftar aset',sets,filterInfo(),fx);

    rows:runs.map(r=>[r.id,perLbl(r.m),r.status,r.entries.length,r.total,r.entries.reduce((s,e)=>s+e.calc,0),r.entries.filter(e=>e.adj).length,r.by,r.d,r.rumus||DEP_CFG.rumus,r.ver?r.ver.by:'',r.ver?r.ver.d:'',r.rej?r.rej.reason:''])};
  const rin={name:'Rincian periode',cols:[['ID periode','txt'],['Periode','txt'],['Status periode','txt'],['ID aset','txt'],['Nama aset','txt'],['Nilai perolehan (Rp)','num'],['Akumulasi sebelum (Rp)','num'],['Hitungan sistem (Rp)','num'],['Angka depresiasi (Rp)','num'],['Disesuaikan','txt'],['Alasan penyesuaian','txt'],['Disesuaikan oleh','txt'],['Akumulasi sesudah (Rp)','num'],['Nilai buku sesudah (Rp)','num']].map(c=>({h:c[0],t:c[1]})),
    rows:runs.flatMap(r=>r.entries.map(e=>[r.id,perLbl(r.m),r.status,e.id,e.name,e.harga,e.before,e.calc,e.dep,e.adj?'Ya':'Tidak',e.adj?e.adj.reason:'',e.adj?e.adj.by:'',e.after,e.book]))};
  doExport('depresiasi','Depresiasi aset',[nilai,per,rin],[['Posisi nilai buku',`Periode terakhir disetujui: ${perLbl(DEP.last)}`],['Rumus',`Baku ${DEP_CFG.rumus}: garis lurus harian, 1 bulan = ${DEP_CFG.hariBulan} hari, nilai sisa Rp 0`]],fx);

/* --- kerangka --- */
const VIEWS={dasbor:vDasbor,register:vRegister,registrasi:vRegistrasi,pic:vPic,depresiasi:vDepresiasi,log:vLog,pengembalian:vPengembalian,disposal:vDisposal};
const view=()=>{const h=location.hash.slice(1);return VIEWS[h]?h:'dasbor';};
function setMenu(open,focusBtn){
  const b=document.getElementById('menu-btn');document.body.classList.toggle('menu-open',open);
  if(b){b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',open?'Tutup menu':'Buka menu');}
  if(open){const a=document.querySelector('nav a[aria-current="page"]')||document.querySelector('nav a');if(a)setTimeout(()=>a.focus(),30);}
  else if(focusBtn&&b)b.focus();
}
function go(v){if(view()===v)render();else location.hash=v;}
function render(){
  const v=view();
  document.querySelectorAll('nav a').forEach(el=>{if(el.getAttribute('href')==='#'+v)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
  document.getElementById('main').innerHTML=VIEWS[v]();
  {const cur=document.querySelector('nav a[aria-current="page"]'),tp=document.getElementById('topbar-page');if(tp&&cur)tp.textContent=cur.childNodes[0].textContent.trim();}
  if(v==='register')renderRows();
  if(v==='log')renderLog();
  const u=me();
  const rv=A.filter(a=>a.status!=='Dihapus'&&a.owner&&a.next&&days(a.next)<0&&(u.jab==='Management Representative (MR)'||a.pic===u.name)).length;
  const off=EMP.filter(e=>e.last&&!S.off.done[e.name]).length;
  const ds=D.filter(r=>!r.isms&&!r.rej).length;
  [['n-review',rv],['n-off',off],['n-ds',ds],['n-dep',depTodo()]].forEach(([id,n])=>{const el=document.getElementById(id);el.textContent=n;el.hidden=!n;});
  renderDrawer(false);
  updateBell();
  saveState();
}
let tt;function toast(msg){saveState();const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;},2600);}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,u=me();
  const cur=S.drawer?byId(S.drawer.id):null;
  const val=id=>{const x=document.getElementById(id);return x?x.value.trim():'';};
  switch(act){
    case 'menu':setMenu(!document.body.classList.contains('menu-open'),true);break;
    case 'menu-close':setMenu(false,true);break;
    case 'open':S.drawer={id:el.dataset.id,mode:null};renderDrawer(true);break;
    case 'close':S.drawer=null;renderDrawer();break;
    case 'gap':S.f={q:'',cat:'',cls:'',status:'',gap:el.dataset.gap};go('register');break;
    case 'clearf':S.f.gap='';render();break;
    case 'mode':S.drawer.mode=el.dataset.mode;renderDrawer();break;
    case 'mode-cancel':S.drawer.mode=null;renderDrawer();break;
    case 'handover-ok':{
      const to=val('h_emp'),prev=cur.holder;
      if(to==='__perusahaan'){const loc=val('h_loc');cur.holder='';cur.status='Disimpan';cur.loc=loc;
        log(cur,prev?`Dikembalikan ke perusahaan oleh ${prev}; belum ada PIC, disimpan di ${loc}`:`Ditetapkan dalam penguasaan perusahaan tanpa PIC, disimpan di ${loc}`);
        S.drawer.mode=null;render();toast(`${cur.id} kembali ke perusahaan, belum ada PIC`);break;}
      if(!document.getElementById('h_ok').checked){document.getElementById('h_err').textContent='Centang persetujuan aturan penggunaan sebelum menyimpan (kontrol 5.10).';return;}
      const emp=EMP.find(x=>x.name===to);cur.holder=emp.name;cur.dept=emp.dept;cur.status='Aktif';notify(emp.name,'aset','Aset diserahkan kepada Anda',`${cur.name} (${cur.id}). Aturan penggunaan sudah disetujui.`,{asset:cur.id});
      log(cur,prev?`Pindah tangan dari ${prev} ke ${emp.name}; aturan penggunaan disetujui`:`Serah terima ke ${emp.name}; aturan penggunaan disetujui`);S.drawer.mode=null;render();toast(`${cur.id} diserahkan ke ${emp.name}`);break;}
    case 'return':{const h=cur.holder;cur.holder='';cur.status='Disimpan';log(cur,`Dikembalikan oleh ${h}`);render();toast(`Pengembalian ${cur.id} dicatat`);break;}
    case 'dispose-ok':{
      const reason=val('d_reason');if(!reason){document.getElementById('d_err').textContent='Tuliskan alasan disposal.';return;}
      const r={id:`DSP-2026-${String(dspSeq++).padStart(3,'0')}`,asset:cur.id,by:u.name,byKey:S.user,d:TODAY,reason,method:val('d_meth'),owner:null,isms:null,rej:null,prev:cur.status};
      D.unshift(r);cur.status='Proses Disposal';log(cur,`Pengajuan disposal ${r.id}`);S.drawer.mode=null;render();toast(`${r.id} diajukan, menunggu ${cur.owner}`);break;}
    case 'activate-ok':{
      const o=val('a_owner'),c=val('a_cls');if(!o||(cur.cat==='INF'&&!c)){document.getElementById('a_err').textContent=cur.cat==='INF'?'Pilih pemilik aset dan klasifikasi.':'Pilih pemilik aset.';return;}
      cur.owner=o;cur.pic=cur.pic||OWNER_PERSON[o]||'';if(cur.cat==='INF'){cur.cls=c;}cur.status=cur.cat==='FIS'?'Disimpan':'Aktif';cur.last=TODAY;cur.next=addMonths(TODAY,ivOf(cur));
      log(cur,'Pemilik dan klasifikasi ditetapkan; aset diaktifkan');S.drawer.mode=null;render();toast(`${cur.id} aktif`);break;}
    case 'reg-save':regSave();break;
    case 'reg-new':S.regDone=null;render();break;
    case 'attest':{const a=byId(el.dataset.id);a.next=addMonths(TODAY,6);log(a,'Review berkala: pemilik mengonfirmasi data masih benar');render();toast(`Review ${a.id} tercatat, berikutnya ${fmt(a.next)}`);break;}
    case 'review':S.drawer={id:el.dataset.id,mode:'review'};renderDrawer(true);break;
    case 'rvmine':S.tab='review';S.f.rv='mine';render();break;
    case 'tab':S.tab=el.dataset.tab;render();break;
    case 'rvf':S.f.rv=el.dataset.rv;render();break;
    case 'schedule':S.drawer={id:el.dataset.id,mode:'schedule'};renderDrawer(true);break;
    case 'note-add':{const t=val('n_text');if(!t){toast('Tulis catatan terlebih dahulu');return;}cur.notes.unshift({d:TODAY,who:u.name,text:t});log(cur,'Catatan aset ditambahkan');render();toast('Catatan disimpan');break;}
    case 'schedule-ok':{
      const pic=val('s_pic'),d=val('s_date'),rem=+val('s_rem'),reason=val('s_reason'),ivv=val('s_iv'),niv=ivv?+ivv:null,base=cur.last?addMonths(cur.last,niv||ivOf({...cur,iv:null})):cur.next,err=t=>{document.getElementById('s_err').textContent=t;};
      if(!d){err('Isi tanggal review.');return;}
      if(dn(d)<dn(TODAY)){err('Tanggal review tidak boleh sebelum hari ini.');return;}
      if(d!==cur.next&&dn(d)>Math.max(dn(base),dn(TODAY))&&!reason){err(`Tanggal ini melewati jadwal interval (${fmt(base)}). Tuliskan alasannya.`);return;}
      const ch=[],oldPic=cur.pic,oldNext=cur.next;
      if(pic!==cur.pic){ch.push(`PIC review ${cur.pic||'kosong'} menjadi ${pic}`);cur.pic=pic;}
      if(niv!==(cur.iv||null)){ch.push(niv?`interval review menjadi ${niv} bulan`:'interval review kembali ikut pengaturan');cur.iv=niv;}
      if(d!==cur.next){ch.push(`tanggal review ${fmt(cur.next)} menjadi ${fmt(d)}`);cur.next=d;}
      cur.manual=!!cur.last&&d!==addMonths(cur.last,ivOf(cur))||(!cur.last&&cur.manual);
      if(rem!==cur.remind){ch.push(`pengingat H-${cur.remind} menjadi H-${rem}`);cur.remind=rem;}
      if(!ch.length){S.drawer.mode=null;renderDrawer();toast('Tidak ada perubahan jadwal');break;}
      if(pic!==oldPic)notify(pic,'review','Anda ditunjuk sebagai PIC review',`${cur.name} (${cur.id}). Review berikutnya ${fmt(d)}.`,{asset:cur.id});
      else if(d!==oldNext)notify(cur.pic,'review','Jadwal review diubah',`${cur.name} (${cur.id}): review berikutnya ${fmt(d)}.`,{asset:cur.id});
      log(cur,`Jadwal review diubah: ${ch.join('; ')}${reason?`. Alasan: ${reason}`:''}`);
      S.drawer.mode=null;render();toast(`Jadwal review ${cur.id} disimpan`);break;}
    case 'iv-asset-save':{
      if(!(u.jab==='Management Representative (MR)'||(cur.owner&&cur.owner===u.jab))||cur.status==='Dihapus')return;
      const ivv=val('s_iv'),niv=ivv?+ivv:null;
      if(niv===(cur.iv||null)){S.drawer.mode=null;renderDrawer();toast('Tidak ada perubahan interval');break;}
      cur.iv=niv;log(cur,`Interval review ${niv?`diatur ${niv} bulan`:'kembali ikut pengaturan'}; berlaku setelah aset diaktifkan`);
      S.drawer.mode=null;render();toast(`Interval review ${cur.id} disimpan`);break;}
    case 'settings':S.ivDraft={...S.iv};S.drawer={settings:true};renderDrawer(true);break;
    case 'iv-suggest':S.ivDraft={Rahasia:3,Internal:12,Publik:12,FIS:12,VIR:6};renderDrawer();break;
    case 'iv-save':{S.iv={...S.ivDraft};syslog('Pengaturan','Interval review',`Interval review diubah: ${Object.entries(S.iv).map(([k,v])=>`${k} ${v} bulan`).join(', ')}`);A.forEach(a=>{if(a.last&&(a.cat!=='INF'||a.cls)&&!a.iv&&!a.manual&&a.status!=='Dihapus')a.next=addMonths(a.last,ivOf(a));});S.drawer=null;render();toast('Pengaturan review disimpan; jadwal review dihitung ulang');break;}
    case 'review-ok':{
      if([...document.querySelectorAll('.rvchk')].some(c=>!c.checked)){document.getElementById('v_err').textContent='Centang semua poin pemeriksaan. Jika ada yang tidak sesuai, ubah datanya dulu.';return;}
      if(cur.cat==='VIR'&&!pplGet('v_admins').length){document.getElementById('v_err').textContent='Minimal satu administrator harus tercatat.';return;}
      const ch=[],loc=val('v_loc'),cls=val('v_cls'),ivv=val('v_iv');
      if(loc!==cur.loc){ch.push(`lokasi ${cur.loc||'kosong'} menjadi ${loc}`);cur.loc=loc;}
      if(cur.cat==='INF'){if(cls!==cur.cls){ch.push(`klasifikasi ${cur.cls} menjadi ${cls}`);cur.cls=cls;}
      const kr=val('v_krit');if(kr&&kr!==cur.x.krit){ch.push(`kritikalitas ${cur.x.krit||'kosong'} menjadi ${kr}`);cur.x.krit=kr;}
      const bk=val('v_backup');if(bk&&bk!==cur.x.backup){ch.push(`backup ${cur.x.backup||'kosong'} menjadi ${bk}`);cur.x.backup=bk;}}
      if(cur.cat==='FIS'){const kd=val('v_kondisi'),en=val('v_enc');
        if(kd&&kd!==cur.x.kondisi){ch.push(`kondisi ${cur.x.kondisi||'kosong'} menjadi ${kd}`);cur.x.kondisi=kd;}
        if(en&&en!==cur.x.enc){ch.push(`status enkripsi ${cur.x.enc||'kosong'} menjadi ${en}`);cur.x.enc=en;}}
      if(cur.cat==='VIR'){const ad=pplGet('v_admins'),us=pplGet('v_users'),an=val('v_akun'),cuEl=document.getElementById('v_capU'),oA=[...(cur.x.admins||[])],oU=[...(cur.x.users||[])];
        if(ad.join('|')!==(cur.x.admins||[]).join('|')){ch.push(`administrator ${(cur.x.admins||[]).join(', ')||'kosong'} menjadi ${ad.join(', ')}`);cur.x.admins=ad;}
        if(us.join('|')!==(cur.x.users||[]).join('|')){ch.push(`pengguna ${(cur.x.users||[]).length} orang menjadi ${us.length} orang`);cur.x.users=us;}
        accessNotify(cur,oA,oU);
        if(an!==''&&+an!==+cur.x.akun){ch.push(`jumlah akun ${cur.x.akun??'kosong'} menjadi ${an}`);cur.x.akun=+an;}
        if(cuEl&&cuEl.value!==''&&+cuEl.value!==+cur.x.capU){ch.push(`kapasitas terpakai ${cur.x.capU??'kosong'} menjadi ${cuEl.value}`);cur.x.capU=+cuEl.value;}}
      const niv=ivv?+ivv:null;if(niv!==(cur.iv||null)){ch.push(niv?`interval review menjadi ${niv} bulan`:'interval review kembali ikut klasifikasi');cur.iv=niv;}
      const note=val('v_note');if(note)cur.notes.unshift({d:TODAY,who:u.name,text:note,tag:'review'});cur.manual=false;cur.last=TODAY;cur.next=addMonths(TODAY,ivOf(cur));

  if(o.S.iv)S.iv=o.S.iv;
  if(o.S.offDone)S.off.done=o.S.offDone;
  const w=document.getElementById('who');if(w)w.value=S.user;
}
function storeNote(){
  const n=document.getElementById('store-note');if(!n)return;
  n.textContent=storeOK?`Prototipe dengan data contoh. Perubahan tersimpan otomatis di browser ini (${new Date().toTimeString().slice(0,5)}).`:'Prototipe dengan data contoh. Penyimpanan browser tidak tersedia, jadi perubahan hilang saat halaman dimuat ulang.';
}
function saveNow(){
  if(!storeOK||storeLock)return;
  try{localStorage.setItem(STORE_KEY,JSON.stringify(snapshot()));}catch(e){storeOK=false;}
  storeNote();
}
function saveState(){if(!storeOK||storeLock)return;clearTimeout(saveT);saveT=setTimeout(saveNow,200);}
function loadState(){
  if(!storeOK)return;
  try{
    const raw=localStorage.getItem(STORE_KEY);if(!raw)return;
    const o=JSON.parse(raw);
    if(validSnap(o))applySnap(o);else{discarded=true;}
  }catch(e){discarded=true;}
}
function importFile(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!validSnap(o)){toast('Berkas tidak dikenali atau berasal dari versi prototipe yang berbeda');return;}
      applySnap(o);S.drawer=null;syslog('Akses','Data prototipe','Impor data prototipe dari berkas JSON');saveNow();render();toast('Data berhasil diimpor');}catch(e){toast('Berkas JSON tidak dapat dibaca');}};
  r.onerror=()=>toast('Berkas tidak dapat dibaca');
  r.readAsText(f);
}
window.addEventListener('pagehide',saveNow);
loadState();
{const dl=document.getElementById('people-list');if(dl)dl.innerHTML=PEOPLE.map(n=>`<option value="${esc(n)}">`).join('');}
window.addEventListener('hashchange',()=>{setMenu(false);S.drawer=null;S.pic={mode:null,id:null,del:null};if(view()!=='registrasi')S.regDone=null;render();window.scrollTo(0,0);});
render();
storeNote();
if(discarded)toast('Data tersimpan lama tidak cocok dengan versi ini, jadi dimulai dari data contoh');
</script>
</body>
</html>
