<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aset MBO – Sistem Manajemen Aset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EF;--surface:#FFFFFF;--sunk:#F4F7F5;--ink:#15302A;--muted:#55695F;--line:#D2DCD8;
  --accent:#1D6B57;--accent-ink:#FFFFFF;--accent-soft:#DAEAE3;
  --warn:#94500A;--warn-soft:#F6E8D5;--crit:#9C2537;--crit-soft:#F5DEE2;--good:#2B713A;--good-soft:#DEEFE1;
  --k-rahasia:#8E2236;--k-terbatas:#A05507;--k-internal:#245B84;--k-publik:#2C703E;--k-none:#87958F;--k-on:#FFFFFF;
  --scrim:rgba(12,24,20,.38);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1714;--surface:#15211D;--sunk:#1B2A25;--ink:#E1EBE7;--muted:#97ABA4;--line:#2A3C36;
    --accent:#6CC6A8;--accent-ink:#0B1714;--accent-soft:#1D3830;
    --warn:#E5A35C;--warn-soft:#3A2C1A;--crit:#F08797;--crit-soft:#3D1F25;--good:#7FCC8F;--good-soft:#1E3524;
    --k-rahasia:#F08797;--k-terbatas:#E9A45C;--k-internal:#82B8E6;--k-publik:#86CF95;--k-none:#7D8E88;--k-on:#0E1714;
    --scrim:rgba(0,0,0,.55);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1714;--surface:#15211D;--sunk:#1B2A25;--ink:#E1EBE7;--muted:#97ABA4;--line:#2A3C36;
  --accent:#6CC6A8;--accent-ink:#0B1714;--accent-soft:#1D3830;
  --warn:#E5A35C;--warn-soft:#3A2C1A;--crit:#F08797;--crit-soft:#3D1F25;--good:#7FCC8F;--good-soft:#1E3524;
  --k-rahasia:#F08797;--k-terbatas:#E9A45C;--k-internal:#82B8E6;--k-publik:#86CF95;--k-none:#7D8E88;--k-on:#0E1714;
  --scrim:rgba(0,0,0,.55);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px;color:var(--ink);text-decoration:none}
.brand svg{flex:none;color:var(--accent)}
.brand b{display:block;font-size:15.5px;line-height:1.2}
.brand span{font-size:12.5px;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;white-space:nowrap}
nav a:hover{background:var(--sunk)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .grp{font-size:12.5px;color:var(--muted);margin:14px 10px 4px}
nav .n{font-size:12px;font-weight:700;min-width:22px;text-align:center;padding:1px 6px;border-radius:999px;background:var(--crit-soft);color:var(--crit)}
.who{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0;display:flex;flex-direction:column;gap:6px}
.who label{font-size:12.5px;color:var(--muted)}
.who p{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.4}
main{padding:28px clamp(16px,3vw,40px) 72px;max-width:1180px;width:100%}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 22px;max-width:68ch}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:16px;margin:0}
.panel-h span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.linkish{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.linkish:hover{text-decoration-color:currentColor}
.kls{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--kc);white-space:nowrap}
.kls::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--kc)}
.kls.none{font-weight:500;font-style:italic}
.st{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.st.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.st.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.st.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.st.mute{color:var(--muted)}
.due{display:flex;flex-direction:column;font-size:13.5px;white-space:nowrap}
.due small{font-size:12px;color:var(--muted)}
.due.crit small{color:var(--crit);font-weight:600}
.due.warn small{color:var(--warn);font-weight:600}

/* dasbor */
.dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.gap{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.gap:first-of-type{border-top:0}
.gap:hover{background:var(--sunk)}
.gap-n{display:grid;place-items:center;height:36px;border-radius:6px;background:var(--crit-soft);color:var(--crit);font-weight:700;font-size:17px}
.gap.clear .gap-n{background:var(--good-soft);color:var(--good)}
.gap.clear .gap-t{color:var(--muted)}
.gap-c{font-size:12.5px;color:var(--muted);white-space:nowrap}
.comp{padding:16px;display:flex;flex-direction:column;gap:14px}
.comp-h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.comp-h span{color:var(--muted)}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;background:var(--sunk)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.gr{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
.gr svg{display:block;width:100%;height:auto;min-width:540px}
.gr-ax{font-size:12px;fill:var(--muted)}
.gr-m{font-size:12px;fill:var(--muted);text-anchor:middle}
.gr-v{font-size:12px;font-weight:700;text-anchor:middle}
.gr-sum{margin:0;font-size:14.5px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:12px 16px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.exp li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.exp small{color:var(--muted);font-size:12.5px;grid-column:1}
.exp .tone{grid-row:1 / span 2;grid-column:2;font-size:13px;font-weight:700;white-space:nowrap}
.tone.crit{color:var(--crit)}.tone.warn{color:var(--warn)}.tone.mute{color:var(--muted)}
.act li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;font-size:14px}
.act time{font-size:12.5px;color:var(--muted);padding-top:1px}
.act small{display:block;margin-top:2px}

/* register */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.filters input{flex:1 1 260px}
input,select,textarea{font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:72px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13.5px;margin-bottom:12px}
.chip button{border:0;background:none;color:inherit;font-size:18px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:999px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12.5px;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td small{display:block;color:var(--muted);font-size:12.5px}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover,.tbl tr.row:focus-visible{background:var(--sunk)}
.tbl tr.row.gone{opacity:.6}
.id{font-weight:600;white-space:nowrap;font-size:13.5px}
.miss{color:var(--crit);font-weight:600}
.count{font-size:13px;color:var(--muted);margin:10px 2px}
.empty{padding:28px 16px;color:var(--muted);text-align:center}

/* form */
.form{padding:20px;display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;font-weight:600}
.req::after{content:" *";color:var(--crit)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.seg{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.seg legend{font-size:13px;font-weight:600;margin-bottom:8px;padding:0}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:8px 18px;border:1px solid var(--line);border-radius:6px;font-weight:600;cursor:pointer}
.seg input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sub{font-size:15px;margin:0;padding-top:18px;border-top:1px solid var(--line)}
.cia{display:flex;gap:8px;align-items:center}
.cia span{font-size:13px;font-weight:600;color:var(--muted)}
.cia select{flex:1}
.err{color:var(--crit);font-weight:600;margin:0;min-height:1.2em;font-size:14px}
.done-wrap{max-width:460px;display:flex;flex-direction:column;gap:18px}

/* tag */
.tag{display:grid;grid-template-columns:minmax(0,1fr) auto;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.tag-band{grid-column:1 / -1;background:var(--kc);color:var(--k-on);font-weight:700;font-size:13px;padding:5px 12px;display:flex;justify-content:space-between;gap:12px}
.tag-body{padding:10px 12px 12px;min-width:0}
.tag-co{font-size:11.5px;color:var(--muted)}
.tag-id{font-size:24px;font-weight:700;letter-spacing:.02em;line-height:1.25;margin-top:2px}
.tag-name{font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.tag-qr{padding:10px 12px 10px 0;color:var(--ink);display:flex;align-items:center}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 24px calc(32px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.dr-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px}
.icon{border:0;background:none;color:var(--ink);font-size:24px;line-height:1;cursor:pointer;padding:4px 10px;border-radius:6px}
.icon:hover{background:var(--sunk)}
.dr-status{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:4px;font-size:13.5px;margin:0}
.note.crit{border-color:var(--crit);background:var(--crit-soft)}
.drawer h3{font-size:14px;margin:12px 0 0}
.attrs{display:grid;grid-template-columns:minmax(120px,38%) minmax(0,1fr);gap:8px 16px;margin:0}
.attrs dt{color:var(--muted);font-size:13.5px}
.attrs dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.rel{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;margin-bottom:6px}
.rel:hover{background:var(--sunk)}
.rel small{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.rel i{width:4px;height:16px;border-radius:2px;background:var(--kc);flex:none}
.hist{list-style:none;margin:4px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.hist li{position:relative;padding:0 0 14px 12px;display:grid;gap:1px;font-size:14px}
.hist li::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.hist time,.hist small{font-size:12.5px;color:var(--muted)}
.box{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--sunk)}
.box h4{margin:0;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;width:16px;height:16px;flex:none}

/* review, opname, pengembalian, disposal */
.rv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.rv:first-child{border-top:0}
.rv-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.rv-main span{font-size:13px}
.notice{padding:12px 16px;border-radius:8px;background:var(--accent-soft);margin:0 0 16px;font-size:14px}
.scanbar{display:flex;flex-wrap:wrap;gap:10px;padding:16px;align-items:center}
.scanbar input{flex:1 1 220px}
.prog-wrap{padding:0 16px 16px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent)}
.ol li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.mark.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.mark.x{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-top:20px}
.sum{padding:16px;display:flex;flex-direction:column;gap:8px}
.sum b{font-size:22px}
.cl li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.cl input[type=checkbox]{width:18px;height:18px}
.ds{padding:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.ds-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.ds-h h2{font-size:17px;margin:0}
.ds p{margin:0;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;list-style:none;padding:0;margin:4px 0}
.steps li{border-top:3px solid var(--line);padding-top:8px;font-size:13.5px}
.steps li.done{border-color:var(--accent)}
.steps li.now{border-color:var(--warn)}
.steps b{display:block}
.steps span{color:var(--muted);font-size:12.5px}
.who-msg{font-size:13.5px;color:var(--muted)}
.file{display:flex;flex-direction:column;gap:6px;font-size:13.5px}

.toasts{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:60}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:520px}

@media (max-width:1000px){.dash,.two{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{z-index:20;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:14px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand span{display:none}
  nav{flex-direction:row;gap:4px}
  nav .grp{display:none}
  .who{margin:0;border:0;padding:0;flex-direction:row;align-items:center}
  .who label,.who p{display:none}
  main{padding-top:22px}
  .rv{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#dasbor">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 7a3 3 0 0 1 3-3h10l9 11-9 11H7a3 3 0 0 1-3-3z" fill="currentColor"/><circle cx="17.5" cy="15" r="2.6" fill="var(--surface)"/></svg>
      <div><b>Aset MBO</b><span>PT Mitra Berdaya Optima</span></div>
    </a>
    <nav aria-label="Menu utama">
      <a href="#dasbor">Ringkasan</a>
      <a href="#register">Register aset</a>
      <a href="#registrasi">Registrasi aset</a>
      <p class="grp">Siklus hidup</p>
      <a href="#review">Review berkala <span class="n" id="n-review" hidden></span></a>
      <a href="#opname">Stock opname</a>
      <a href="#pengembalian">Pengembalian <span class="n" id="n-off" hidden></span></a>
      <a href="#disposal">Disposal <span class="n" id="n-ds" hidden></span></a>
    </nav>
    <div class="who">
      <label for="who">Masuk sebagai</label>
      <select id="who">
        <option value="rina">Rina Hapsari, ISMS Manager</option>
        <option value="budi">Budi Santoso, Kepala TI</option>
        <option value="dewi">Dewi Lestari, Staf GA</option>
      </select>
      <p>Prototipe dengan data contoh. Perubahan hilang saat halaman dimuat ulang.</p>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="drawer-root"></div>
<div class="toasts" aria-live="polite"><div class="toast" id="toast" hidden></div></div>

<script>
const TODAY='2026-11-19';
const MONTHS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const dn=s=>Date.parse(s+'T00:00:00Z')/864e5;
const days=s=>Math.round(dn(s)-dn(TODAY));
const fmt=s=>{if(!s)return '–';const p=s.split('-');return `${+p[2]} ${MONTHS.at(+p[1]-1)} ${p[0]}`;};

function qr(id){
  let h=2166136261;for(const ch of id){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}
  const N=17,fin=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);let s='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(fin(x,y))continue;h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;if(h&1)s+=`M${x} ${y}h1v1h-1z`;}
  const f=(x,y)=>`M${x} ${y}h7v7h-7z M${x+1} ${y+1}v5h5v-5z M${x+2} ${y+2}h3v3h-3z`;
  return `<svg viewBox="-1 -1 ${N+2} ${N+2}" width="84" height="84" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="${f(0,0)} ${f(N-7,0)} ${f(0,N-7)}"/><path fill="currentColor" d="${s}"/></svg>`;
}

function growthData(){
  const ms=[];for(let k=11;k>=0;k--)ms.push(addMonths('2026-11-01',-k).slice(0,7));
  const base={'2025-12':[1,0],'2026-01':[0,1],'2026-02':[2,0],'2026-03':[1,0],'2026-04':[0,1],'2026-05':[3,0],'2026-06':[1,0],'2026-07':[2,1],'2026-08':[0,0],'2026-09':[1,0],'2026-10':[1,1]};
  const now=TODAY.slice(0,7),inNow=(a,t)=>a.hist.some(h=>h[0].startsWith(now)&&h[2].includes(t));
  const rows=ms.map(m=>m===now?{m,add:A.filter(a=>inNow(a,'Aset diregistrasi')).length,rem:A.filter(a=>inNow(a,'disetujui ISMS Manager')).length}:{m,add:base[m][0],rem:base[m][1]});
  let t=live().length;for(let k=rows.length-1;k>=0;k--){rows[k].total=t;t=t-rows[k].add+rows[k].rem;}
  return rows;
}
function growthPanel(){

  const mx=Math.max(1,...r.map(d=>Math.max(d.add,d.rem))),z=205,bs=48/mx,bw=Math.min(22,step*.5);

    <text x="${cx(0).toFixed(1)}" y="${(ly(r[0].total)-10).toFixed(1)}" class="gr-v" fill="var(--ink)">${r[0].total}</text>
    <text x="${cx(last).toFixed(1)}" y="${(ly(r[last].total)-10).toFixed(1)}" class="gr-v" fill="var(--ink)">${r[last].total}</text>
    <text x="${x0}" y="${z-66}" class="gr-ax">Aset masuk dan keluar per bulan</text>
    ${r.map((d,i)=>{const x=(cx(i)-bw/2).toFixed(1),c=cx(i).toFixed(1);return `${d.add?`<rect x="${x}" y="${z-d.add*bs}" width="${bw.toFixed(1)}" height="${d.add*bs}" rx="2" fill="var(--good)"><title>${mon(d.m)}: ${d.add} aset masuk</title></rect><text x="${c}" y="${z-d.add*bs-6}" class="gr-v" fill="var(--good)">+${d.add}</text>`:''}${d.rem?`<rect x="${x}" y="${z}" width="${bw.toFixed(1)}" height="${d.rem*bs}" rx="2" fill="var(--crit)"><title>${mon(d.m)}: ${d.rem} aset keluar</title></rect><text x="${c}" y="${z+d.rem*bs+14}" class="gr-v" fill="var(--crit)">−${d.rem}</text>`:''}<text x="${c}" y="${H-8}" class="gr-m">${mon(d.m)}</text>`;}).join('')}

function filtered(){

function opAdd(raw){
  const id=String(raw||'').trim().toUpperCase();if(!id||S.op.done)return;

  else{const a=byId(id);if(!S.op.extra.some(x=>x.id===id))S.op.extra.push({id,note:a?`Tercatat di ${a.loc}, bukan di lokasi ini`:'Tidak ada di register'});toast(a?`${id} tercatat di lokasi lain`:`${id} tidak ada di register`);}
  render();const s=document.getElementById('scan');if(s)s.focus();
}

function vPengembalian(){
  const emp=S.off.emp,held=A.filter(a=>a.holder===emp&&a.status!=='Dihapus'),done=S.off.done[emp];

  return `<h1>Disposal</h1><p class="lead">Aset hanya berstatus Dihapus setelah disetujui pemilik aset dan ISMS Manager, dengan bukti sanitasi atau pemusnahan terlampir (kontrol 7.10, 7.14, 8.10).</p>
  ${open.length?open.map(card).join(''):'<section class="panel"><p class="empty">Tidak ada pengajuan disposal yang menunggu. Ajukan disposal dari halaman detail aset.</p></section>'}
  <section class="panel scroll" style="margin-top:8px"><div class="panel-h"><h2>Riwayat disposal</h2></div><table class="tbl"><thead><tr><th>ID</th><th>Aset</th><th>Hasil</th><th>Bukti</th><th>Ditutup</th></tr></thead><tbody>${closed.length?closed.map(r=>{const a=byId(r.asset);return `<tr><td class="id">${r.id}</td><td><button class="linkish" data-act="open" data-id="${a.id}">${esc(a.name)}</button><small>${a.id}</small></td><td>${r.isms?st('Dihapus'):'<span class="st crit">Ditolak</span>'}</td><td>${r.isms?esc(r.isms.ev):'–'}</td><td>${fmt((r.isms||r.rej).d)}</td></tr>`;}).join(''):'<tr><td colspan="5" class="empty">Belum ada disposal yang ditutup.</td></tr>'}</tbody></table></section>`;
}

/* --- detail aset --- */
const RANK={Rahasia:0,Terbatas:1,Internal:2,Publik:3};
function renderDrawer(focus){
  const root=document.getElementById('drawer-root');
  if(!S.drawer){root.innerHTML='';document.body.classList.remove('locked');return;}
  const a=byId(S.drawer.id),m=S.drawer.mode,u=me();document.body.classList.add('locked');
  const notes=[];
  if(!a.owner&&a.status!=='Dihapus')notes.push(['crit','Belum ada pemilik aset. Aset tidak dapat aktif sebelum pemilik ditetapkan (kontrol 5.9).']);
  if(!a.cls&&a.status!=='Dihapus')notes.push(['crit','Aset belum diklasifikasi (kontrol 5.12).']);
  if(a.cat!=='INF'&&a.cls){a.related.map(byId).filter(r=>r.cat==='INF'&&r.cls&&RANK[r.cls]<RANK[a.cls]).forEach(r=>notes.push(['','Aset ini menampung '+r.name+' yang berklasifikasi '+r.cls+'. Klasifikasi aset ini harus minimal '+r.cls+'.']));}
  if(a.cat==='INF'&&!a.related.length&&a.status!=='Dihapus')notes.push(['','Belum ada aset pendukung. Catat di mana informasi ini disimpan.']);
  if(a.x['Status enkripsi']==='Tidak'&&(a.cls==='Rahasia'||a.cls==='Terbatas')&&a.status!=='Dihapus')notes.push(['crit',`Media berisi informasi ${a.cls} belum terenkripsi (kontrol 8.1).`]);
  if(a.next&&days(a.next)<0&&a.status!=='Dihapus')notes.push(['',`Review berkala ${rel(days(a.next))}.`]);
  let actions='';
  if(m==='handover')actions=`<div class="box"><h4>Serah terima aset</h4><div class="field"><label for="h_emp">Diserahkan kepada</label><select id="h_emp">${EMP.map(e=>opt(e.name,`${e.name}, ${e.dept}`,'')).join('')}</select></div><label class="check"><input type="checkbox" id="h_ok"><span>Penerima telah membaca dan menyetujui aturan penggunaan aset perusahaan.</span></label><p class="err" id="h_err" role="alert"></p><div class="row-btns"><button class="btn pri" data-act="handover-ok">Simpan serah terima</button><button class="btn" data-act="mode-cancel">Batal</button></div></div>`;
  else if(m==='dispose'){const meth=a.cat==='INF'?['Penghapusan data sesuai jadwal retensi','Pemusnahan arsip kertas (shredding)']:['Penghapusan aman (secure erase)','Degaussing','Penghancuran fisik','Penghapusan aman, lalu penghancuran fisik'];actions=`<div class="box"><h4>${a.cat==='INF'?'Ajukan penghapusan data':'Ajukan disposal'}</h4><div class="field"><label for="d_meth">Metode sanitasi</label><select id="d_meth">${meth.map(x=>opt(x,x,'')).join('')}</select></div><div class="field"><label for="d_reason" class="req">Alasan</label><textarea id="d_reason"></textarea></div><p class="err" id="d_err" role="alert"></p><div class="row-btns"><button class="btn pri" data-act="dispose-ok">Kirim pengajuan</button><button class="btn" data-act="mode-cancel">Batal</button></div></div>`;}
  else if(m==='activate')actions=`<div class="box"><h4>Lengkapi dan aktifkan</h4><div class="field"><label for="a_owner" class="req">Pemilik aset</label><select id="a_owner">${opt('','Pilih jabatan','')}${OWNERS.map(o=>opt(o,o,a.owner)).join('')}</select></div><div class="field"><label for="a_cls" class="req">Klasifikasi</label><select id="a_cls">${opt('','Pilih klasifikasi','')}${CLS.map(k=>opt(k,k,a.cls)).join('')}</select></div><div class="field"><span class="lbl" style="font-size:13px;font-weight:600">Nilai C / I / A</span><div class="cia">${['c','i','a'].map(k=>`<span>${k.toUpperCase()}</span><select id="a_${k}" aria-label="Nilai ${k.toUpperCase()}">${[1,2,3].map(n=>opt(String(n),String(n),String(a[k]))).join('')}</select>`).join('')}</div></div><p class="err" id="a_err" role="alert"></p><div class="row-btns"><button class="btn pri" data-act="activate-ok">Aktifkan aset</button><button class="btn" data-act="mode-cancel">Batal</button></div></div>`;
  else{
    const b=[];
    if(a.status==='Draf')b.push(`<button class="btn pri" data-act="mode" data-mode="activate">Lengkapi dan aktifkan</button>`);
    if(a.cat!=='INF'&&!a.holder&&['Disimpan','Aktif'].includes(a.status))b.push(`<button class="btn pri" data-act="mode" data-mode="handover">Serah terima</button>`);
    if(a.cat!=='INF'&&a.holder&&a.status!=='Dihapus')b.push(`<button class="btn" data-act="return" data-id="${a.id}">Catat pengembalian</button>`);
    if(!['Dihapus','Proses Disposal','Draf'].includes(a.status))b.push(`<button class="btn danger" data-act="mode" data-mode="dispose">${a.cat==='INF'?'Ajukan penghapusan data':'Ajukan disposal'}</button>`);
    if(a.status==='Proses Disposal')b.push(`<a class="btn" href="#disposal">Lihat pengajuan disposal</a>`);
    actions=b.length?`<div class="row-btns">${b.join('')}</div>`:'';
  }
  const attrs=[['Pemilik aset',a.owner||'<span class="miss">Belum ada</span>',true],['Pemegang',a.holder||'–'],['Departemen',a.dept||'–'],['Lokasi',a.loc||'–'],['Nilai C / I / A',`${a.c} / ${a.i} / ${a.a}`],['Review berikutnya',fmt(a.next)]];
  if(a.exp)attrs.push([`${a.expLabel} berakhir`,`${fmt(a.exp)} (${rel(days(a.exp))})`]);
  Object.entries(a.x).forEach(([k,v])=>attrs.push([k,v]));
  root.innerHTML=`<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Detail ${a.id}">
    <div class="dr-top"><span class="muted">Aset ${CAT_LABEL[a.cat].toLowerCase()}, ${esc(a.sub)}</span><button class="icon" data-act="close" aria-label="Tutup detail" id="dr-close">×</button></div>
    ${tag(a)}
    <div class="dr-status">${st(a.status)}<span>Kritikalitas ${crit(a)} (${CRIT_W[crit(a)]})</span></div>
    ${notes.map(([t,s])=>`<p class="note ${t}">${esc(s)}</p>`).join('')}
    ${actions}
    <h3>Atribut</h3>
    <dl class="attrs">${attrs.map(([k,v,raw])=>`<dt>${esc(k)}</dt><dd>${raw?v:esc(v)}</dd>`).join('')}</dl>
    <h3>Aset terkait</h3>
    <div>${a.related.length?a.related.map(id=>{const r=byId(id);return `<button class="rel" data-act="open" data-id="${id}" style="--kc:var(${r.cls?KVAR[r.cls]:'--k-none'})"><i></i>${esc(r.name)}<small>${id}</small></button>`;}).join(''):'<p class="muted" style="margin:0;font-size:14px">Belum ada relasi.</p>'}</div>
    <h3>Riwayat</h3>
    <ol class="hist">${a.hist.map(h=>`<li><time>${fmt(h[0])}</time><span>${esc(h[2])}</span><small>${esc(h[1])}</small></li>`).join('')}</ol>
  </aside>`;
  if(focus){const c=document.getElementById('dr-close');if(c)c.focus();}
}

/* --- kerangka --- */
const VIEWS={dasbor:vDasbor,register:vRegister,registrasi:vRegistrasi,review:vReview,opname:vOpname,pengembalian:vPengembalian,disposal:vDisposal};
const view=()=>{const h=location.hash.slice(1);return VIEWS[h]?h:'dasbor';};
function go(v){if(view()===v)render();else location.hash=v;}
function render(){
  const v=view();
  document.querySelectorAll('nav a').forEach(el=>{if(el.getAttribute('href')==='#'+v)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
  document.getElementById('main').innerHTML=VIEWS[v]();
  if(v==='register')renderRows();
  const u=me();
  const rv=A.filter(a=>a.status!=='Dihapus'&&a.owner&&a.next&&days(a.next)<0&&(u.jab==='ISMS Manager'||a.owner===u.jab)).length;
  const off=EMP.filter(e=>e.last&&!S.off.done[e.name]).length;
  const ds=D.filter(r=>!r.isms&&!r.rej).length;
  [['n-review',rv],['n-off',off],['n-ds',ds]].forEach(([id,n])=>{const el=document.getElementById(id);el.textContent=n;el.hidden=!n;});
  renderDrawer(false);
}
let tt;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;},2600);}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,u=me();
  const cur=S.drawer?byId(S.drawer.id):null;
  const val=id=>{const x=document.getElementById(id);return x?x.value.trim():'';};
  switch(act){
    case 'open':S.drawer={id:el.dataset.id,mode:null};renderDrawer(true);break;
    case 'close':S.drawer=null;renderDrawer();break;
    case 'gap':S.f={q:'',cat:'',cls:'',status:'',gap:el.dataset.gap};go('register');break;
    case 'clearf':S.f.gap='';render();break;
    case 'mode':S.drawer.mode=el.dataset.mode;renderDrawer();break;
    case 'mode-cancel':S.drawer.mode=null;renderDrawer();break;
    case 'handover-ok':{
      if(!document.getElementById('h_ok').checked){document.getElementById('h_err').textContent='Centang persetujuan aturan penggunaan sebelum menyimpan (kontrol 5.10).';return;}
      const emp=EMP.find(x=>x.name===val('h_emp'));cur.holder=emp.name;cur.dept=emp.dept;cur.status='Aktif';
      log(cur,`Serah terima ke ${emp.name}; aturan penggunaan disetujui`);S.drawer.mode=null;render();toast(`${cur.id} diserahkan ke ${emp.name}`);break;}
    case 'return':{const h=cur.holder;cur.holder='';cur.status='Disimpan';log(cur,`Dikembalikan oleh ${h}`);render();toast(`Pengembalian ${cur.id} dicatat`);break;}
    case 'dispose-ok':{
      const reason=val('d_reason');if(!reason){document.getElementById('d_err').textContent='Tuliskan alasan disposal.';return;}
      const r={id:`DSP-2026-${String(dspSeq++).padStart(3,'0')}`,asset:cur.id,by:u.name,byKey:S.user,d:TODAY,reason,method:val('d_meth'),owner:null,isms:null,rej:null,prev:cur.status};
      D.unshift(r);cur.status='Proses Disposal';log(cur,`Pengajuan disposal ${r.id}`);S.drawer.mode=null;render();toast(`${r.id} diajukan, menunggu ${cur.owner}`);break;}
    case 'activate-ok':{
      const o=val('a_owner'),c=val('a_cls');if(!o||!c){document.getElementById('a_err').textContent='Pilih pemilik aset dan klasifikasi.';return;}
      cur.owner=o;cur.cls=c;cur.c=+val('a_c');cur.i=+val('a_i');cur.a=+val('a_a');cur.status=cur.cat==='FIS'?'Disimpan':'Aktif';cur.next=addMonths(TODAY,6);
      log(cur,'Pemilik dan klasifikasi ditetapkan; aset diaktifkan');S.drawer.mode=null;render();toast(`${cur.id} aktif`);break;}
    case 'reg-save':regSave();break;
    case 'reg-new':S.regDone=null;render();break;
    case 'attest':{const a=byId(el.dataset.id);a.next=addMonths(TODAY,6);log(a,'Review berkala: pemilik mengonfirmasi data masih benar');render();toast(`Review ${a.id} tercatat, berikutnya ${fmt(a.next)}`);break;}
    case 'remind':{const a=byId(el.dataset.id);toast(`Pengingat review dikirim ke ${a.owner}`);break;}
    case 'op-add':opAdd(val('scan'));break;
    case 'op-sim':{const n=expected().find(a=>!S.op.found.includes(a.id));if(n)opAdd(n.id);else toast('Semua aset di lokasi ini sudah ditemukan');break;}
    case 'op-done':{const ex=expected();S.op.done=true;ex.forEach(a=>log(a,S.op.found.includes(a.id)?`Ditemukan saat stock opname di ${S.op.loc}`:`Tidak ditemukan saat stock opname di ${S.op.loc}`));render();toast('Stock opname ditutup');break;}
    case 'op-reset':S.op={loc:S.op.loc,found:[],extra:[],done:false};render();break;
    case 'off-done':{
      const emp=S.off.emp,held=A.filter(a=>a.holder===emp&&a.status!=='Dihapus'),res=[];
      held.forEach(a=>{const c=S.off.cond[a.id]||'Baik';a.holder='';
        if(c==='Hilang'){a.status='Hilang';log(a,`Dilaporkan hilang saat pengembalian oleh ${emp}; diteruskan ke manajemen insiden`);}
        else if(c==='Rusak'){a.status='Dalam Perbaikan';log(a,`Dikembalikan oleh ${emp} dalam kondisi rusak`);}
        else{a.status='Disimpan';a.loc='Gudang GA';log(a,`Dikembalikan oleh ${emp} dalam kondisi baik`);}
        res.push([a.id,c]);});
      S.off.done[emp]={d:TODAY,res};S.off.chk={};render();toast(`Pengembalian ${emp} ditutup`);break;}
    case 'ds-owner':case 'ds-isms':case 'ds-rej':{
      const r=D.find(x=>x.id===el.dataset.r),a=byId(r.asset);
      if(act==='ds-owner'){r.owner={by:u.name,d:TODAY};log(a,`Disposal ${r.id} disetujui pemilik aset`);toast(`${r.id} diteruskan ke ISMS Manager`);}
      if(act==='ds-isms'){r.isms={by:u.name,d:TODAY,ev:S.ev[r.id]};a.status='Dihapus';a.holder='';log(a,`Disposal ${r.id} disetujui ISMS Manager; bukti ${S.ev[r.id]} diunggah`);toast(`${a.id} berstatus Dihapus`);}
      if(act==='ds-rej'){r.rej={by:u.name,d:TODAY};a.status=r.prev||'Disimpan';log(a,`Disposal ${r.id} ditolak`);toast(`${r.id} ditolak`);}
      render();break;}
  }
});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){S.f[f]=e.target.value;renderRows();}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='who'){S.user=t.value;if(S.drawer)S.drawer.mode=null;render();toast(`Masuk sebagai ${me().name}, ${me().jab}`);return;}
  if(t.name==='cat'&&t.closest('#regform')){S.regCat=t.value;document.getElementById('regx').innerHTML=regExtra(t.value);document.getElementById('r_sub').innerHTML=SUBS[t.value].map(s=>opt(s,s,'')).join('');document.getElementById('regx-title').textContent=`Atribut aset ${CAT_LABEL[t.value].toLowerCase()}`;return;}
  if(t.classList.contains('ciasel')){const n=Math.max(...['c','i','a'].map(k=>+document.getElementById('c_'+k).value));document.getElementById('critout').textContent=`Kritikalitas ${n} (${CRIT_W[n]})`;return;}
  if(t.hasAttribute('data-oploc')){S.op={loc:t.value,found:[],extra:[],done:false};render();return;}
  if(t.dataset.chk){S.off.chk[t.dataset.chk]=t.checked;render();return;}
  if(t.dataset.cond){S.off.cond[t.dataset.cond]=t.value;return;}
  if(t.id==='offemp'){S.off.emp=t.value;S.off.chk={};render();return;}
  if(t.dataset.ev){S.ev[t.dataset.ev]=t.files&&t.files[0]?t.files[0].name:'';render();return;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.drawer){S.drawer=null;renderDrawer();return;}
  if(e.key==='Enter'){
    if(e.target.id==='scan'){e.preventDefault();opAdd(e.target.value);return;}
    const row=e.target.closest&&e.target.closest('tr.row');if(row){S.drawer={id:row.dataset.id,mode:null};renderDrawer(true);}
  }
});
window.addEventListener('hashchange',()=>{S.drawer=null;if(view()!=='registrasi')S.regDone=null;render();window.scrollTo(0,0);});
render();
</script>
